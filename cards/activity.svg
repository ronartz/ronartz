<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-label="Monthly contributions as animated bars with verified streaks and active days"><title>Monthly contributions as animated bars with verified streaks and active days</title><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#D84F35"/><stop offset=".65" stop-color="#EE7945"/><stop offset="1" stop-color="#FFD5B6"/></linearGradient><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="tileclip"><rect width="880" height="340" rx="14"/></clipPath></defs><style>@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:scale(.25)}to{opacity:1;transform:scale(1)}}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes glow{0%,100%{opacity:.4}50%{opacity:1}}.rise{animation:rise .85s cubic-bezier(.2,.7,.2,1) both}.fade{animation:fade .75s ease-out both}.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s ease-out both}.grow{transform-box:fill-box;transform-origin:bottom;animation:grow .85s cubic-bezier(.2,.8,.2,1) both}.glow{animation:glow 2.1s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.rise,.fade,.pop,.grow,.glow{animation:none!important;opacity:1!important;transform:none!important}}</style><rect x="0" y="0" width="880" height="340" rx="14" fill="#F5F0E8" /><text x="36" y="40" font-family="Consolas,Monaco,monospace" font-size="12" font-weight="bold" fill="#766D67" letter-spacing="1.2">THE LAST 12 MONTHS, IN COMMITS</text><text x="36" y="96" font-family="Georgia,Times New Roman,serif" font-size="55" font-weight="normal" fill="#221B18" >60</text><text x="146" y="96" font-family="Georgia,Times New Rom