<svg xmlns="http://www.w3.org/2000/svg" width="880" height="416" viewBox="0 0 880 416" role="img" aria-label="Shreejit Mondal — editorial orange profile hero with a printing ASCII portrait"><title>Shreejit Mondal — editorial orange profile hero with a printing ASCII portrait</title><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#D84F35"/><stop offset=".65" stop-color="#EE7945"/><stop offset="1" stop-color="#FFD5B6"/></linearGradient><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="tileclip"><rect width="880" height="416" rx="14"/></clipPath></defs><style>@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:scale(.25)}to{opacity:1;transform:scale(1)}}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes glow{0%,100%{opacity:.4}50%{opacity:1}}.rise{animation:rise .85s cubic-bezier(.2,.7,.2,1) both}.fade{animation:fade .75s ease-out both}.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s ease-out both}.grow{transform-box:fill-box;transform-origin:bottom;animation:grow .85s cubic-bezier(.2,.8,.2,1) both}.glow{animation:glow 2.1s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.rise,.fade,.pop,.grow,.glow{animation:none!important;opacity:1!important;transform:none!important}}</style><rect x="0" y="0" width="880" height="416" rx="14" fill="#F5F0E8" /><rect x="0" y="0" width="9" height="416" rx="0" fill="#D84F35" /><rect x="35" y="40" width="8" height="8" rx="4" fill="#D84F35" /><text x="54" y="49" font-family="Consolas,Monaco,monospace" font-size="12" font-weight="bold" fill="#766D67" letter-spacing="2.0">A PERSONAL BUILD LOG</text><text x="35" y="154" font-family="Georgia,Times New Roman,serif" font-size="90" font-weight="normal" fill="#221B18" class="rise" style="animation-delay:.08s">Shreejit</text><text x="35" y="242" font-family="Georgia,Times New Roman,serif" font-size="91" font-weight="normal" fill="#D84F35" font-style="italic" class="rise" style="animation-delay:.20s">Mondal.</text><rect x="37" y="265" width="448" height="2" rx="0" fill="#D84F35" /><text x="37" y="301" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="bold" fill="#221B18" class="rise" style="animation-delay:.38s">Python / Applied AI / Cloud</text><text x="37" y="331" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" fill="#766D67" class="rise" style="animation-delay:.47s">A student, a curious builder,</text><text x="37" y="353" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="normal" fill="#766D67" class="rise" style="animation-delay:.56s">and someone who loves making things work.</text><rect x="37" y="381" width="111" height="23" rx="11" fill="#FFE0CB" /><text x="50" y="397" font-family="Consolas,Monaco,monospace" font-size="11" font-weight="bold" fill="#7F3E2C" >BCA  ·  2027</text><rect x="160" y="381" width="136" height="23" rx="11" fill="#F2E5D9" /><text x="172" y="397" font-family="Consolas,Monaco,monospace" font-size="11" font-weight="normal" fill="#65574E" >learning in public</text><rect x="545" y="25" width="301" height="354" rx="13" fill="#FFFCF7" /><rect x="557" y="37" width="277" height="330" rx="8" fill="#FFF8EF" stroke="#DDD2C6" stroke-width=".8"/><text x="573" y="58" font-family="Consolas,Monaco,monospace" font-size="12" font-weight="bold" fill="#D84F35" >portrait.txt</text><circle class="glow" cx="807" cy="52" r="4.2" fill="#E85F37"/><path d="M570 68H818" stroke="#DAC5B4" stroke-width="1"/><text x="581" y="91.0" font-family="Consolas,Monaco,monospace" font-size="10.5" font-weight="normal" fill="#8D452D" xml:space="preserve" class="fade" style="animation-delay:0.450s">                .=+*###+-</