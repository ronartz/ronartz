<svg xmlns="http://www.w3.org/2000/svg" width="439" height="206" viewBox="0 0 439 206" role="img" aria-label="Featured project Java Practice"><title>Featured project Java Practice</title><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#D84F35"/><stop offset=".65" stop-color="#EE7945"/><stop offset="1" stop-color="#FFD5B6"/></linearGradient><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="tileclip"><rect width="439" height="206" rx="14"/></clipPath></defs><style>@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:scale(.25)}to{opacity:1;transform:scale(1)}}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes glow{0%,100%{opacity:.4}50%{opacity:1}}.rise{animation:rise .85s cubic-bezier(.2,.7,.2,1) both}.fade{animation:fade .75s ease-out both}.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s ease-out both}.grow{transform-box:fill-box;transform-origin:bottom;animation:grow .85s cubic-bezier(.2,.8,.2,1) both}.glow{animation:glow 2.1s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.rise,.fade,.pop,.grow,.glow{animation:none!important;opacity:1!important;transform:none!important}}@keyframes nudge{50%{transform:translate(3px,-3px)}100%{transform:none}}.nudge{animation:nudge 2s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.nudge{animation:none}}</style><rect x="0" y="0" width="439" height="206" rx="11" fill="#FFFCF7" stroke="#DDD2C6" stroke-width="1"/><rect x="0" y="0" width="6" height="206" rx="2" fill="#DE8F55" /><text x="25" y="38" font-family="Consolas,Monaco,monospace" font-size="12" font-weight="bold" fill="#D84F35" letter-spacing=".7">04 / PROGRAMMING EXERCISES</text