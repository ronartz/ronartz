<svg xmlns="http://www.w3.org/2000/svg" width="880" height="81" viewBox="0 0 880 81" role="img" aria-label="Featured projects section"><title>Featured projects section</title><style>
@keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:.1;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes glide{from{transform:translateX(-140px)}to{transform:translateX(320px)}}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}
.enter{animation:enter .7s cubic-bezier(.2,.75,.2,1) both}
.fade{animation:fade .8s ease both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .38s ease-out both}
.grow{transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.75,.2,1) both}
.pulse{animation:pulse 2s ease-in-out infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 22s linear infinite}
.blink{animation:blink .85s steps(1) infinite}
.glint{animation:glide 6s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transform:none!important}}
</style><defs><linearGradient id="heat" x1="0" x2="1">
<stop stop-color="#E54D37"/><stop offset=".62" stop-color="#FE784A"/>
<stop offset="1" stop-color="#FFC299"/></linearGradient>
<linearGradient id="sheen" x1="0" x2="1">
<stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".25"/>
<stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect x="4.50" y="4.50" width="871.00" height="72.00" rx="14" fill="#0F1014" stroke="#34343B" stroke-width="1"/><text x="36.00" y="46.00" font-size="13" fill="#FE784A" font-family="Consolas,Menlo,monospace" font-weight="bold" >02</text><text x="70.00" y="46.00" font-size="18" fill="#F8F5F1" font-family="Arial,Helvetica,sans-serif" font-weight="bold" >Selected work</text><text x="843.00" y="46.00" font-size="11" fill="#78797D" font-family="Consolas,Menlo,monospace" font-weight="normal" text-anchor="end">PROJECTS / 2026</text></svg>
