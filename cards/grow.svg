<svg xmlns="http://www.w3.org/2000/svg" width="340" height="190" viewBox="0 0 340 190" role="img" aria-label="GROW — Backend learning journey"><title>GROW — Backend learning journey</title><defs><linearGradient id="fire" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FF4D31"/><stop offset=".6" stop-color="#FF874A"/><stop offset="1" stop-color="#FFC38A"/></linearGradient><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset=".5" stop-color="#FFE5BD" stop-opacity=".8"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient></defs><style>@keyframes rise{from{opacity:0;transform:translateY(17px)}to{opacity:1;transform:translateY(0)}}@keyframes ring{0%,100%{opacity:.25;transform:scale(.85)}50%{opacity:.75;transform:scale(1.15)}}@keyframes dash{to{stroke-dashoffset:-80}}.rise{animation:rise .75s 1.4s both}.ring{transform-origin:285px 41px;animation:ring 3s ease-in-out infinite}.flash{stroke-dasharray:80 120;animation:dash 4s linear infinite}@media(prefers-reduced-motion:reduce){.rise,.ring,.flash{animation:none!important}}</style><rect width="340" height="190" rx="14" fill="#111012"/><rect x="1" y="1" width="338" height="188" rx="13" fill="none" stroke="#563026" stroke-width="1.3"/><rect x="12" y="12" width="316" height="166" rx="10" fill="#211819" stroke="#FFC38A" stroke-opacity=".45"/><circle class="ring" cx="285" cy="41" r="22" fill="none" stroke="#FFC38A" stroke-width="2" opacity=".65"/><text x="30" y="44" fill="#FFC38A" font-family="monospace" font-size="15" font-weight="700" >03 / FOCUS</text><text x="30" y="93" fill="#FFF7F0" font-family="Arial,Helvetica,sans-serif" font-size="40" font-weight="800" class="rise">GROW</text><text x="30" y="124" fill="#FFC38A" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" >Backend learning journey</text><text x="30" y="153" fill="#D5B7A7" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" >Python ·