<svg xmlns="http://www.w3.org/2000/svg" width="293" height="222" viewBox="0 0 293 222" role="img" aria-label="03 / GROW — always improving"><title>03 / GROW — always improving</title><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#D84F35"/><stop offset=".65" stop-color="#EE7945"/><stop offset="1" stop-color="#FFD5B6"/></linearGradient><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><clipPath id="tileclip"><rect width="293" height="222" rx="14"/></clipPath></defs><style>@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:scale(.25)}to{opacity:1;transform:scale(1)}}@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}@keyframes glow{0%,100%{opacity:.4}50%{opacity:1}}.rise{animation:rise .85s cubic-bezier(.2,.7,.2,1) both}.fade{animation:fade .75s ease-out both}.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s ease-out both}.grow{transform-box:fill-box;transform-origin:bottom;animation:grow .85s cubic-bezier(.2,.8,.2,1) both}.glow{animation:glow 2.1s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.rise,.fade,.pop,.grow,.glow{animation:none!important;opacity:1!important;transform:none!important}}@keyframes tilein{0%{opacity:0;transform:translateY(85px) scale(.82) rotate(-5deg)}60%{opacity:1;transform:translateY(-7px) scale(1.02) rotate(1deg)}85%{transform:translateY(2px) scale(.99)}100%{transform:none;opacity:1}}@keyframes nudge{50%{transform:translate(4px,-3px)}100%{transform:none}}@keyframes waves{0%{opacity:.6;transform:scale(.55)}100%{opacity:0;transform:scale(2.25)}}@keyframes sweep{0%{transform:translateX(0)}32%,100%{transform:translateX(495px)}}.tile{transform-box:fill-box;transform-origin:center;animation:tilein 1s cubic-bezier(.2,.7,.2,1) both}.nudge{animation:nudge 1.8s ease-in-out infinite}.ring{transform-origin:253px 172px;animation:waves 2.8s ease-out infinite}.shine{animation:sweep 5.4s ease-in-out infinite}@media(prefers-reduced-motion:reduce){.tile,.nudge,.ring,.shine{animation:none!important;opacity:1!important;transform:none!important}.ring,.shine{display:none}}</style><g class="tile" clip-path="url(#tileclip)" style="animation-delay:3.35s"><rect x="0" y="0" width="293" height="210" rx="14" fill="#F6CDAE" /><text x="24" y="36" font-family="Consolas,Monaco,monospace" font-size="13" font-weight="bold" fill="#271815" letter-spacing="1.5">03 / GROW</text><text x="260" y="37" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="normal" fill="#271815" class="nudge">↗</text><text x="23" y="111" font-family="Georgia,Times New Roman,serif" font-size="62" font-weight="normal" fill="#271815" >∞</text><text x="24" y="152" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="bold" fill="#271815" >always improving</text><text x="24" y="174" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#271815" >Curiosity over titles.</text><text x="24" y="191" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="normal" fill="#271815" >Understanding each step.</text><circle class="ring" cx="253" cy="172" r="31" fill="none" stroke="#271815" stroke-opacity=".50" stroke-width="2"/><path class="shine" d="M-110 0H-18V220H-110Z" fill="url(#shine)"/></g></svg>
