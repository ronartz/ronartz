<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="255" viewBox="0 0 1200 255" role="img" aria-label="Shreejit Mondal - animated red and orange developer profile banner">
<defs>
<linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B0D11"/><stop offset=".53" stop-color="#111013"/><stop offset="1" stop-color="#220E09"/></linearGradient>
<linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FF482D"/><stop offset=".5" stop-color="#FF8A48"/><stop offset="1" stop-color="#FFCC93"/></linearGradient>
<linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FF512D" stop-opacity="0"/><stop offset=".5" stop-color="#FF713B" stop-opacity=".55"/><stop offset="1" stop-color="#FF512D" stop-opacity="0"/></linearGradient>
<radialGradient id="flare"><stop stop-color="#EF592B" stop-opacity=".45"/><stop offset=".5" stop-color="#AD250B" stop-opacity=".16"/><stop offset="1" stop-color="#F24A21" stop-opacity="0"/></radialGradient>
<clipPath id="clip"><rect width="1200" height="255" rx="15"/></clipPath>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#FF7845" opacity=".075" stroke-width=".7"/></pattern>
</defs>
<style>
@keyframes sweep{0%{transform:translateX(-460px)}100%{transform:translateX(1620px)}}
@keyframes blink{0%,44%{opacity:1}48%,94%{opacity:0}100%{opacity:1}}
@keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(-28px,-6px)}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes dash{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-112}}
@keyframes pulse2{0%,100%{transform:scale(.8);opacity:.35}50%{transform:scale(1.12);opacity:.85}}
.laser{animation:sweep 6.5s linear infinite}.aura{animation:float 6s ease-in-out infinite}.cursor{animation:blink 1s steps(1) infinite}.p{animation:pulse 2.2s ease-in-out infinite}.dashes{animation:dash 3s linear infinite}.orb{animation:pulse2 3s ease-in-out infinite;transform-origin:1120px 210px}
@media(prefers-reduced-motion:reduce){.laser,.aura,.cursor,.p,.dashes,.orb{animation:none}}
</style>
<g clip-path="url(#clip)">
<rect width="1200" height="255" fill="url(#base)"/>
<rect width="1200" height="255" fill="url(#grid)"/>
<ellipse class="aura" cx="1070" cy="105" rx="295" ry="196" fill="url(#flare)"/>
<path class="laser" d="M0 -20H110V300H0Z" fill="url(#scan)" opacity=".28" transform="skewX(-25)"/>
<path d="M0 253H1200" stroke="#FF632E" stroke-width="2"/>
<rect x="38" y="31" width="6" height="14" rx="3" fill="#FF5C32"/>
<text x="56" y="43" font-family="monospace" font-size="13" letter-spacing="3.8" fill="#FFA475">SOFTWARE · AI · CLOUD</text>
<text x="39" y="117" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="71" letter-spacing="1.2" fill="#FFFFFF">SHREEJIT</text>
<text x="39" y="191" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="71" letter-spacing="1.2" fill="url(#hot)">MONDAL</text>
<path d="M40 206H636" stroke="url(#hot)" opacity=".8" stroke-width="2"/>
<text x="42" y="236" font-family="monospace" font-size="15" fill="#FFB993">LEARN. BUILD. UNDERSTAND. REPEAT.</text>
<rect x="747" y="39" width="399" height="174" rx="13" fill="#101014" fill-opacity=".94" stroke="#9A402B" stroke-opacity=".72" stroke-width="1.4"/>
<rect x="747" y="39" width="399" height="35" rx="13" fill="#3B1D18" fill-opacity=".7"/>
<rect x="747" y="63" width="399" height="11" fill="#3B1D18" fill-opacity=".7"/>
<circle cx="768" cy="57" r="5" fill="#FF5035"/><circle cx="786" cy="57" r="5" fill="#FF9652"/><circle cx="804" cy="57" r="5" fill="#FFC376"/>
<text x="827" y="62" font-family="monospace" font-size="12" fill="#FFB792">ronartz / status</text>
<text x="769" y="104" font-family="monospace" font-size="15" fill="#FF996E">$ whoami</text>
<text x="769" y="127" font-family="monospace" font-size="16" fill="#F3EDE9">shreejit.mondal</text>
<text x="769" y="159" font-family="monospace" font-size="14" fill="#FF996E">$ current_focus</text>
<text x="769" y="181" font-family="monospace" font-size="14" fill="#E9D9D1">Python + RAG + Cloud <tspan class="cursor" fill="#FF7841">▌</tspan></text>
<path class="dashes" d="M1037 223H1161" stroke="#FF753D" stroke-width="2.5" stroke-dasharray="10 18"/>
<circle class="orb" cx="1120" cy="210" r="27" fill="none" stroke="#FF753D" stroke-opacity=".6" stroke-width="1.4"/>
<circle cx="1120" cy="210" r="4" fill="#FFB36F"/>
<text x="745" y="239" font-family="monospace" font-size="13" fill="#B78A75">github.com/ronartz</text>
</g></svg>