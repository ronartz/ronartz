name: Generate red-orange contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "13 3 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate animated contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ronartz
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FF7A36&color_dots=%231A1210,%23452A22,%237F3C24,%23C4542C,%23FF9B54

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
